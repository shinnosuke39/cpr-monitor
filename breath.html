<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>呼吸の記録｜CPR練習モニター</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#0f141a; color:#e8eef4; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; -webkit-user-select:none; user-select:none; overflow:hidden; }
  body { display:flex; flex-direction:column; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); gap:12px; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#93a3b3; }
  #net.ok { color:#7dffb0; } #net.ng { color:#ffb199; }
  .nums { display:flex; gap:10px; }
  .nums div { flex:1; background:#1a222c; border-radius:12px; padding:10px; text-align:center; }
  .nums b { display:block; font-size:44px; font-variant-numeric:tabular-nums; }
  .nums span { font-size:13px; color:#93a3b3; }
  #tap { flex:1; border:none; border-radius:24px; background:#22a0c8; color:#fff; font-size:34px; font-weight:800; font-family:inherit; line-height:1.4; touch-action:manipulation; }
  #tap.flash { background:#7fe3ff; color:#06323f; }
  #msg { border-radius:14px; padding:12px; text-align:center; font-size:20px; font-weight:700; line-height:1.5; background:#26313d; color:#ffd84a; }
  #msg.done { background:#1f9d55; color:#fff; font-size:22px; }
  #msg small { display:block; font-size:14px; font-weight:500; }
  .hint { font-size:13px; color:#93a3b3; text-align:center; line-height:1.6; }
</style>
</head>
<body>
  <div class="top"><span id="net">つないでいます…</span><span id="room"></span></div>
  <div class="nums">
    <div><b id="rr">--</b><span>呼吸数（回/分）</span></div>
    <div><b id="iv">--</b><span>前回からの秒数</span></div>
    <div><b id="cnt">0</b><span>押した回数</span></div>
  </div>
  <div id="msg">学生がバッグを押すのに合わせて<br>タップしてください</div>
  <button id="tap">学生がバッグを<br>押したら タップ</button>
  <p class="hint">緑の「もう押さなくて大丈夫です」が出るまで（6回ほど）押してもらえば、そのリズムを覚えて、あとはモニターが<b>自動で続けます</b>（押すのをやめてよい）。途中でまた押すと合わせ直します。10回/分なら6秒に1回。<br>先生のiPadで「呼吸数の出し方：スマホで記録」を選んでおいてください。</p>
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  const { ROOM, createSync, keepAwake } = window.CPR;
  const $ = (id) => document.getElementById(id);
  $('room').textContent = '部屋：' + ROOM;
  const sync = createSync(() => { }, (s) => {
    $('net').textContent = s === 'online' ? 'つながっています' : (s === 'offline' ? 'ネットにつながっていません' : 'つないでいます…');
    $('net').className = s === 'online' ? 'ok' : (s === 'offline' ? 'ng' : '');
  });
  let taps = [], count = 0;
  function rr() {
    const iv = [];
    for (let i = taps.length - 1; i >= 1 && iv.length < 6; i--) { const d = taps[i] - taps[i - 1]; if (d >= 1500 && d <= 20000) iv.push(d); }
    if (!iv.length) return '--';
    return Math.round(60000 / (iv.reduce((a, b) => a + b, 0) / iv.length));
  }
  // 何回押せばリズムを覚えたとみなすか：6回（間隔5つ）押して、間隔のばらつきが小さいこと
  const NEED = 6;
  function learned() {
    const iv = [];
    for (let i = taps.length - 1; i >= 1 && iv.length < 5; i--) { const d = taps[i] - taps[i - 1]; if (d >= 1500 && d <= 20000) iv.push(d); }
    if (iv.length < NEED - 1) return { ok: false, left: NEED - 1 - iv.length };
    const mean = iv.reduce((a, b) => a + b, 0) / iv.length;
    const sd = Math.sqrt(iv.reduce((a, b) => a + (b - mean) * (b - mean), 0) / iv.length);
    return { ok: sd / mean < 0.3, left: 0, steady: sd / mean < 0.3 };
  }
  function show() {
    const L = learned(); const m = $('msg');
    if (L.ok) { m.className = 'done'; m.innerHTML = '✓ もう押さなくて大丈夫です<small>このリズム（' + rr() + '回/分）でモニターが自動で続けます。ペースが変わったら、また押してください</small>'; }
    else if (!taps.length) { m.className = ''; m.innerHTML = '学生がバッグを押すのに合わせて<br>タップしてください'; }
    else if (L.left > 0) { m.className = ''; m.innerHTML = 'あと ' + L.left + ' 回押してください<small>リズムを覚えています</small>'; }
    else { m.className = ''; m.innerHTML = 'もう少し押してください<small>間隔がばらついているので、そろうまで続けてください</small>'; }
    $('rr').textContent = rr();
    $('iv').textContent = taps.length ? ((Date.now() - taps[taps.length - 1]) / 1000).toFixed(0) : '--';
    $('cnt').textContent = count;
  }
  function tap(e) {
    e.preventDefault();
    window.__wantAwake = true; keepAwake();
    taps.push(Date.now()); taps = taps.filter(t => Date.now() - t < 90000); count++;
    sync.send({ type: 'breath', at: Date.now() });
    if (navigator.vibrate) navigator.vibrate(30);
    const b = $('tap'); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 150);
    show();
  }
  $('tap').addEventListener('touchstart', tap, { passive: false });
  $('tap').addEventListener('mousedown', tap);
  setInterval(show, 500);
})();
</script>
</body>
</html>
