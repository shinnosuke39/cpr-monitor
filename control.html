<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>操作｜CPR練習モニター</title>
<style>
  :root { --bg:#0f141a; --card:#1a222c; --line:#2a3644; --txt:#e8eef4; --sub:#93a3b3; --on:#1f9d55; --acc:#2f7df6; --warn:#e8590c; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--bg); color:var(--txt); font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; -webkit-user-select:none; user-select:none; }
  body { padding:10px 12px 40px; }
  .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .pill { padding:6px 12px; border-radius:999px; background:var(--card); font-size:15px; }
  .pill.ok { background:#123d26; color:#7dffb0; } .pill.ng { background:#4a1d10; color:#ffb199; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--card); border-radius:12px; padding:10px 12px; }
  .card h2 { font-size:15px; color:var(--sub); font-weight:600; margin-bottom:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  button { font-family:inherit; font-size:17px; font-weight:600; color:var(--txt); background:#26313d; border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:48px; min-width:52px; cursor:pointer; touch-action:manipulation; }
  button:active { transform:scale(0.97); }
  button.sel { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.on { background:var(--on); border-color:var(--on); color:#fff; }
  .big { font-size:24px; min-height:70px; width:100%; }
  #cpr.on { background:#c92a2a; border-color:#c92a2a; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { filter:brightness(1.25); } }
  .val { min-width:80px; text-align:center; font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .lab { min-width:70px; font-size:15px; color:var(--sub); }
  .conn button { flex:1; min-width:96px; }
  .timer { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .timer.due { color:#ffb000; animation:pulse 0.8s infinite; }
  .cues { display:flex; flex-direction:column; gap:6px; }
  .cue { display:flex; gap:8px; align-items:stretch; }
  .cue button { flex:1; text-align:left; display:flex; gap:10px; align-items:center; padding:8px 10px; min-height:52px; }
  .cue .tm { font-variant-numeric:tabular-nums; min-width:50px; color:#ffd84a; font-size:18px; }
  .cue .sc { font-size:13px; color:var(--sub); font-weight:500; }
  .cue.now button { outline:3px solid #ffd84a; }
  .cue.done button { opacity:0.55; }
  .memo { font-size:15px; color:#ffd84a; min-height:22px; margin-top:6px; }
  select { font-size:17px; padding:10px; border-radius:10px; background:#26313d; color:var(--txt); border:1px solid var(--line); width:100%; min-height:48px; }
  input[type=range] { width:200px; }
  .small { font-size:13px; color:var(--sub); line-height:1.6; }
</style>
</head>
<body>
<div class="bar">
  <span class="pill" id="net">つないでいます…</span>
  <span class="pill" id="room"></span>
  <span class="pill">圧迫 <span class="timer" id="cprTimer" style="font-size:20px">0:00</span></span>
  <span class="pill">シナリオ <span id="scTimer" style="font-size:20px;font-weight:700">0:00</span></span>
</div>

<div class="grid">
  <!-- 左の列 -->
  <div style="display:flex;flex-direction:column;gap:10px;">
    <div class="card">
      <button id="cpr" class="big">心臓マッサージ 開始</button>
    </div>

    <div class="card">
      <h2>つなぐ（学生がつけたら押す）</h2>
      <div class="row conn" id="conn"></div>
    </div>

    <div class="card">
      <h2>心電図のリズム</h2>
      <div class="row" id="rhythm"></div>
      <div class="row"><span class="lab">心拍数</span>
        <button data-step="hr:-10">−10</button><button data-step="hr:-1">−1</button>
        <span class="val" id="v_hr"></span>
        <button data-step="hr:1">＋1</button><button data-step="hr:10">＋10</button></div>
    </div>

    <div class="card">
      <h2>EtCO₂（呼気の二酸化炭素）</h2>
      <div class="row"><span class="lab">EtCO₂</span>
        <button data-step="etco2:-5">−5</button><button data-step="etco2:-1">−1</button>
        <span class="val" id="v_etco2"></span>
        <button data-step="etco2:1">＋1</button><button data-step="etco2:5">＋5</button></div>
      <div class="row" id="co2mode"></div>
      <div class="row"><span class="lab">呼吸数</span>
        <button data-step="rr:-1">−1</button><span class="val" id="v_rr"></span><button data-step="rr:1">＋1</button>
        <span class="lab" style="margin-left:8px">換気量</span>
        <button data-step="vt:-10">−10</button><span class="val" id="v_vt" style="font-size:22px"></span><button data-step="vt:10">＋10</button></div>
    </div>

    <div class="card">
      <h2>SpO₂・血圧・体温</h2>
      <div class="row"><span class="lab">SpO₂</span>
        <button data-step="spo2:-1">−1</button><span class="val" id="v_spo2"></span><button data-step="spo2:1">＋1</button></div>
      <div class="row"><span class="lab">血圧 上</span>
        <button data-step="sys:-10">−10</button><span class="val" id="v_sys"></span><button data-step="sys:10">＋10</button>
        <span class="lab" style="margin-left:6px">下</span>
        <button data-step="dia:-10">−10</button><span class="val" id="v_dia"></span><button data-step="dia:10">＋10</button></div>
      <div class="row"><button id="nibpGo" style="flex:1">血圧を測る（モニターに表示）</button><button id="nibpNone">測定不能 -/-</button></div>
      <div class="row"><span class="lab">体温</span>
        <button data-step="temp:-0.1">−0.1</button><span class="val" id="v_temp"></span><button data-step="temp:0.1">＋0.1</button></div>
    </div>

    <div class="card">
      <h2>麻酔ガス（O₂・ISO）</h2>
      <div class="row"><span class="lab">O₂</span>
        <button data-step="fio2:-5">−5</button><span class="val" id="v_fio2"></span><button data-step="fio2:5">＋5</button></div>
      <div class="row"><span class="lab">ISO 吸気</span>
        <button data-step="isoIn:-0.1">−0.1</button><span class="val" id="v_isoIn"></span><button data-step="isoIn:0.1">＋0.1</button>
        <span class="lab" style="margin-left:6px">呼気</span>
        <button data-step="isoEx:-0.1">−0.1</button><span class="val" id="v_isoEx"></span><button data-step="isoEx:0.1">＋0.1</button></div>
    </div>
  </div>

  <!-- 右の列 -->
  <div style="display:flex;flex-direction:column;gap:10px;">
    <div class="card">
      <h2>シナリオ</h2>
      <select id="scSel"></select>
      <div class="row" style="margin-top:8px">
        <button id="scStart" class="on" style="flex:1">▶ 時計スタート</button>
        <button id="scStop">一時停止</button>
        <button id="scNext" style="flex:1">次へ ▶</button>
      </div>
      <div class="cues" id="cues"></div>
      <div class="memo" id="memo"></div>
      <h2 style="margin-top:10px">シーンを直接選ぶ</h2>
      <div class="row" id="scenes"></div>
    </div>

    <div class="card">
      <h2>音（モニターから鳴ります）</h2>
      <div class="row" id="sounds"></div>
      <div class="row"><span class="lab">音量</span><input type="range" id="vol" min="0" max="1" step="0.05"><span id="volv"></span></div>
    </div>

    <div class="card">
      <h2>表示</h2>
      <div class="row">
        <button id="showCase">動物名を出す</button>
        <button id="showAlarm">アラームの文字（VFなど）を出す</button>
      </div>
      <div class="row"><button id="allOff">すべて外す（次の班の前に）</button><button id="resetAll">最初の状態にもどす</button></div>
      <p class="small">モニターの上の時計が白＝この操作画面とつながっています（オレンジ＝しばらく届いていない）。</p>
    </div>
  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/control.js"></script>
</body>
</html>
