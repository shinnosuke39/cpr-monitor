<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPR練習モニター</title>
<style>
  body { margin:0; background:#0f141a; color:#e8eef4; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:28px 16px; }
  h1 { font-size:24px; margin:0 0 6px; } p { color:#a9b7c4; line-height:1.7; }
  a.b { display:block; text-decoration:none; color:#fff; font-size:22px; font-weight:700; padding:22px; border-radius:14px; margin:14px 0; text-align:center; }
  .m { background:#1f6f3f; } .c { background:#2f7df6; }
  label { font-size:15px; color:#a9b7c4; } input { font-size:18px; padding:8px; border-radius:8px; border:1px solid #2a3644; background:#1a222c; color:#fff; width:120px; }
  small { color:#7d8b98; }
</style>
</head>
<body>
<main>
  <h1>CPR練習モニター</h1>
  <p>プロジェクターにつないだパソコンで「モニター」、手元のiPadで「操作」を開きます。2台とも、ふつうのインターネットにつながっていれば動きます。</p>
  <label>部屋の名前（2台を同じにする）：<input id="room" value="cpr1"></label>
  <a class="b m" id="toMon" href="monitor.html">モニター（学生が見る画面）</a>
  <a class="b c" id="toCtl" href="control.html">操作（先生のiPad）</a>
  <a class="b" id="toBr" href="breath.html" style="background:#1c7f99">呼吸の記録（もう1人の先生のスマホ）</a>
  <p><small>ネットが切れたときは、同じパソコンでモニターと操作を別々の窓で開けば、そのパソコンだけで動きます。</small></p>
</main>
<script>
  const r = document.getElementById('room');
  function upd() { const v = encodeURIComponent((r.value || 'cpr1').trim());
    document.getElementById('toMon').href = 'monitor.html?room=' + v;
    document.getElementById('toCtl').href = 'control.html?room=' + v;
    document.getElementById('toBr').href = 'breath.html?room=' + v; }
  r.addEventListener('input', upd); upd();
</script>
</body>
</html>
